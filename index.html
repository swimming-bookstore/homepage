<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수영 책방 Swimming Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+KR:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --cream: #fff9ef; --ink: #1d3550; --mute: #6a5c4e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--cream); }
    body { font-family: Outfit, system-ui, sans-serif; color: var(--ink); }
    .hero {
      position: relative; height: 100vh; height: 100svh;
      overflow: hidden;
    }
    canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: pan-y;
    }
    header {
      position: fixed; top: 0; left: 0; z-index: 2;
      padding: 28px 40px; pointer-events: none;
    }
    .brand {
      font-family: "Noto Serif KR", "Cormorant Garamond", serif;
      font-weight: 600; letter-spacing: 0.08em;
      font-size: 15px;
    }
    .brand em {
      font-family: "Cormorant Garamond", serif;
      font-style: italic; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      font-size: 13px; margin-left: 10px; opacity: 0.72;
    }


    #debug {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3;
      background: rgba(29, 53, 80, 0.88); color: #fff9ef;
      font-size: 11px; line-height: 1.45; letter-spacing: 0.02em;
      padding: 8px 12px; margin: 0; border-radius: 8px;
      pointer-events: auto;
      max-width: 220px;
    }

    #debug h2 {
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      opacity: 0.7; margin-bottom: 8px; font-weight: 500;
    }
    #debug ul { list-style: none; }
    #debug li { cursor: pointer; }
    #debug li.off { opacity: 0.35; text-decoration: line-through; }
    #debug .hint { margin-top: 8px; opacity: 0.6; font-size: 10px; }
    #debug .opt { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; cursor: pointer; }
    #debug .opt input { margin: 0; }
    #debug.hidden { display: none; }
    .motto {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: var(--cream);
      position: relative; z-index: 1;
    }
    .motto p {
      font-family: "Cormorant Garamond", serif;
      font-style: italic; font-weight: 500;
      font-size: clamp(36px, 7vw, 72px);
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    footer {
      padding: 28px 40px 36px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--mute);
    }
    @media (max-width: 720px) {
      header { padding: 16px 18px 8px; }
      body.debug-on header { position: relative; }
      .brand { font-size: 13px; letter-spacing: 0.04em; }
      .brand em { display: block; margin: 4px 0 0; font-size: 11px; letter-spacing: 0.14em; }
      footer { padding: 20px 18px 28px; font-size: 11px; }
      #debug {
        position: static;
        max-width: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">수영 책방 <em>Swimming Bookstore</em></span>
  </header>
  <aside id="debug" class="hidden"></aside>
  <section class="hero">
    <canvas id="scene"></canvas>
  </section>
  <section class="motto" id="motto">
    <p>play don't work</p>
  </section>
  <footer>© 수영 책방 Swimming Bookstore</footer>

  <script src="three.min.js"></script>
  <script src="shop.min.js"></script>
</body>
</html>
